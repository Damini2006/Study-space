# StudySpace on Render — deployed as a Blueprint.
#
# Render → New → Blueprint → this repo: the resources below are created
# from this file. Secret values are typed once, in the
# "studyspace-secrets" env group, during the blueprint review — the
# repo never holds them (sync: false).
#
# After the first deploy, CI can trigger redeploys: paste each service's
# deploy hook into the GitHub secrets RENDER_BACKEND_DEPLOY_HOOK /
# RENDER_WORKER_DEPLOY_HOOK — ci.yml's deploy-render job uses them and
# skips quietly while they are unset.
#
# Free-plan notes: the web service sleeps after idle (~1 min cold start
# on the next hit). Validated with `render blueprints validate` (CLI
# v2.28): the current validator rejects the once-standard
# `render-version` header AND any paid resource while the workspace has
# no payment method — which is why the worker below is commented out.

services:
  - type: web
    name: studyspace-api
    runtime: docker
    plan: free
    # Closest Render region to the Supabase project (ap-south-1).
    region: singapore
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    envVars:
      # uvicorn binds 8000 (backend/Dockerfile CMD); telling Render's
      # router the same port is simpler than rewriting the command.
      - key: PORT
        value: "8000"
      - key: ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: studyspace-redis
          property: connectionString
      - fromGroup: studyspace-secrets

  # The background worker is temporarily OUT of the blueprint: Render
  # validates paid resources against the workspace's payment method
  # ("need_payment_info" on services[1]) and no card is attached. Web
  # + Redis deploy free today; re-enable the block below by adding a
  # card and deleting the comment markers. Until then uploads still
  # store fine but their chunks never get embedded, so chat over NEW
  # sources returns nothing — seeded demo data is unaffected.
  #
  # - type: worker
  #   name: studyspace-worker
  #   runtime: docker
  #   # Not "free": Render offers no free background-worker tier; this
  #   # is the cheapest instance that exists for the type.
  #   plan: 0.5c-512mb
  #   region: singapore
  #   # Root build context on purpose: the worker image copies backend/
  #   # beside itself so pip can install both (the header of
  #   # worker/Dockerfile records the import failure that taught this).
  #   dockerfilePath: worker/Dockerfile
  #   dockerContext: .
  #   envVars:
  #     - key: REDIS_URL
  #       fromService:
  #         type: keyvalue
  #         name: studyspace-redis
  #         property: connectionString
  #     - fromGroup: studyspace-secrets

  # Render Key Value (managed Redis) — a service, not a database:
  # the `databases:` list is Postgres-only.
  - type: keyvalue
    name: studyspace-redis
    plan: free
    region: singapore
    # Required field for key value; [] means no external ingress —
    # only the two services above reach it, over Render's internal
    # network via connectionString.
    ipAllowList: []

envVarGroups:
  - name: studyspace-secrets
    # (A description here would be convenient, but the blueprint schema
    # allows only name + envVars — values come from the Supabase
    # dashboard, your OpenAI account, and the frontend's URL.)
    envVars:
      # Project URL is public by design (the frontend bundle ships it);
      # every other value stays typed in the dashboard, never in git.
      - key: SUPABASE_URL
        value: https://xqywjdvpohbzybcuihnm.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Direct connection (port 5432), not the pooler: the backend is a
      # long-running server holding a pool, which is exactly what the
      # transaction pooler is bad at.
      - key: DATABASE_URL
        sync: false
      - key: LITELLM_API_KEY
        sync: false
      # Comma-separated origins of the deployed frontend, e.g.
      # https://studyspace.vercel.app
      - key: CORS_ORIGINS
        sync: false
