# StudySpace docker-compose (local dev)

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studyspace-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studyspace_local
    ports:
      - "54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studyspace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyspace-backend
    environment:
      # The shipped image defaults to ENV=production (docs off); compose
      # is the local dev stack, so the generated /docs UI stays on.
      ENV: development
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/studyspace_local
      DB_USER_ROLE: authenticated
      REDIS_URL: redis://redis:6379/0
      LITELLM_MODEL: ${LITELLM_MODEL}
      LITELLM_JUDGE_MODEL: ${LITELLM_JUDGE_MODEL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      RERANKER: ${RERANKER}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LANGFUSE_ENABLED: "true"
      CORS_ORIGINS: http://localhost:5173
      DEMO_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Same flag as the image's CMD: this app writes its own request lines,
    # and compose overrides the CMD when it sets a command.
    command: uvicorn studyspace.main:app --host 0.0.0.0 --port 8000 --no-access-log

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: studyspace-worker
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/studyspace_local
      DB_USER_ROLE: authenticated
      REDIS_URL: redis://redis:6379/0
      LITELLM_MODEL: ${LITELLM_MODEL}
      LITELLM_JUDGE_MODEL: ${LITELLM_JUDGE_MODEL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      RERANKER: ${RERANKER}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LANGFUSE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq studyspace_worker.main.WorkerSettings

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL}
    container_name: studyspace-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: