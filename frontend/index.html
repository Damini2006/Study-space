<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1526" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)" />

    <title>StudySpace - source-grounded AI study workspace</title>
    <meta
      name="description"
      content="StudySpace is a source-grounded AI study workspace. Chat with your notes, generate study material and review with real FSRS spaced repetition."
    />
    <meta name="author" content="StudySpace" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://studyspace.app/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="StudySpace" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="StudySpace - source-grounded AI study workspace" />
    <meta
      property="og:description"
      content="Chat with your notes, generate study material and review with real FSRS spaced repetition."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://studyspace.app/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StudySpace - every claim traceable" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudySpace - source-grounded AI study workspace" />
    <meta
      name="twitter:description"
      content="Chat with your notes, generate study material and review with real FSRS spaced repetition."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="StudySpace - every claim traceable" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured data: lets search engines show sitelinks + a sitelinks search box. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://studyspace.app/#website",
            "url": "https://studyspace.app/",
            "name": "StudySpace",
            "description": "Source-grounded AI study workspace with FSRS spaced repetition.",
            "inLanguage": "en",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://studyspace.app/app/dashboard?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "StudySpace",
            "url": "https://studyspace.app/",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "author": { "@type": "Organization", "name": "StudySpace" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Analytics is installed but inert until you set VITE_GA_ID in .env.
      // Page views are sent on every SPA route change (see src/main.jsx).
      (function () {
        var id = "%VITE_GA_ID%";
        if (!id || id.charAt(0) === "%") return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", id, { send_page_view: false });
      })();
    </script>
    <script>
      // Apply theme before first paint (no flash) - localStorage wins,
      // then falls back to the signed-in user's stored theme (hydrated later).
      (function () {
        try {
          var t = localStorage.getItem("studyspace.theme");
          if (t && ["light", "dark", "cozy", "pastel"].indexOf(t) !== -1) {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {
          /* private mode */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      StudySpace needs JavaScript to run. Please enable it, or read our
      <a href="/privacy">privacy policy</a> and <a href="/terms">terms of service</a>.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
