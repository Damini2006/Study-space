<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StudySpace — source-grounded AI study workspace. Chat with your notes, generate study material, review with spaced repetition."
    />
    <title>StudySpace — source-grounded AI study workspace</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="StudySpace — source-grounded AI study workspace" />
    <meta property="og:description" content="Chat with your notes, generate study material, review with spaced repetition." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://studyspace.app/" />
    <meta property="og:image" content="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
      crossorigin="anonymous"
    />
    <script>
      // Analytics is installed but inert until you set VITE_GA_ID in .env.
      // Page views are sent on every SPA route change (see src/main.jsx).
      (function () {
        var id = "%VITE_GA_ID%";
        if (!id || id.charAt(0) === "%") return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", id, { send_page_view: false });
      })();
    </script>
    <script>
      // Apply theme before first paint (no flash) — localStorage wins,
      // then falls back to the signed-in user's stored theme (hydrated later).
      (function () {
        try {
          var t = localStorage.getItem("studyspace.theme");
          if (t && ["light", "dark", "cozy", "pastel"].indexOf(t) !== -1) {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {
          /* private mode */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
