# Frontend nginx config (served at /)

server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    #
    # NOTE: nginx's add_header does not merge down into a nested location —
    # declaring any add_header there discards every one inherited from this
    # block. The static-asset location below therefore has to restate the
    # whole set, and the CSP in particular has to appear twice. tests/csp.test.js
    # checks every copy against index.html so they cannot drift.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'sha256-MsWy4ftYYT8Rjvuslp+JhpXazU3ZExOgYT949b8XEaY=' 'sha256-qWDTQU4JLXiWwHRWh/gSplakgQnLiPCEjUYuRms9xXs=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; manifest-src 'self'; worker-src 'self' blob:" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # SPA routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets - long cache.
    #
    # This add_header Cache-Control is the reason the security headers above
    # would otherwise vanish here: nosniff matters most for exactly these
    # files, so the full set is restated rather than inherited.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), browsing-topics=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'sha256-MsWy4ftYYT8Rjvuslp+JhpXazU3ZExOgYT949b8XEaY=' 'sha256-qWDTQU4JLXiWwHRWh/gSplakgQnLiPCEjUYuRms9xXs=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; manifest-src 'self'; worker-src 'self' blob:" always;
    }

    # API proxy (not used in production - API on separate domain)
    # location /api/ {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
