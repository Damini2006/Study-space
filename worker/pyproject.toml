[project]
name = "studyspace-worker"
version = "0.1.0"
description = "StudySpace ARQ worker: ingestion pipeline and background jobs"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "arq>=0.26,<1.0",
  "redis>=5.0,<7.0",
  "pypdf>=4.2,<6.0",
  "pdfplumber>=0.10,<1.0",
  "python-docx>=1.1,<2.0",
  "httpx>=0.27,<1.0",
  "litellm>=1.60,<2.0",
  "langfuse>=3.2,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studyspace_worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
