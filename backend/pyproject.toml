[project]
name = "studyspace-backend"
version = "0.1.0"
description = "StudySpace — source-grounded AI study workspace (FastAPI backend)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-multipart>=0.0.9",
  "asyncpg>=0.29,<1.0",
  "httpx>=0.27,<1.0",
  "joserfc>=0.9,<2.0",
  "redis>=5.0,<7.0",
  # Imported unconditionally by `studyspace.queue`, which `demo` and therefore
  # `main` reach — without it the app fails to import, so it is a hard
  # dependency, not an optional extra.
  "arq>=0.25,<1.0",
  "litellm>=1.60,<2.0",
  "langgraph>=1.0,<2.0",
  "langfuse>=3.2,<5.0",
  "fsrs>=6.0,<7.0",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "fakeredis>=2.26",
  "ruff>=0.6",
  "anyio>=4.4",
  "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studyspace*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:litellm.*",
  "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
